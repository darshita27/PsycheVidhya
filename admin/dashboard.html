<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Dashboard — Manova mental wellness</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="admin-header">
    <h1>Manova mental wellness Admin</h1>
    <div style="display:flex; align-items:center; gap:1rem;">
      <span class="who" id="whoAmI"></span>
      <button class="logout-btn" id="logoutBtn" type="button">Log out</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="tabs" role="tablist">
      <button class="tab-btn active" id="tabBookingsBtn" type="button" role="tab" aria-selected="true">Session Requests</button>
      <button class="tab-btn" id="tabMessagesBtn" type="button" role="tab" aria-selected="false">Messages</button>
    </div>

    <section class="panel active" id="bookingsPanel">
      <div class="table-wrap">
        <div id="bookingsContent" class="loading-state">Loading…</div>
      </div>
    </section>

    <section class="panel" id="messagesPanel">
      <div class="table-wrap">
        <div id="messagesContent" class="loading-state">Loading…</div>
      </div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
